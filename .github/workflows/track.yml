name: Track ticket prices

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (the script decides which events are due)
  workflow_dispatch:          # lets you click "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: ticket-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Take price snapshots and rebuild the report
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SEATGEEK_CLIENT_SECRET: ${{ secrets.SEATGEEK_CLIENT_SECRET }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          python tracker.py poll
          python tracker.py report

      - name: Save the new data
        run: |
          git config user.name "ticket-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No new snapshots this run."
          else
            git commit -m "Price snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
